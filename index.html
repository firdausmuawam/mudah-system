<style>

}

@media (max-width:360px){.grid2{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const VER='1.1';
const KEY='id.os-umkum.data';
const TIPE=['aset','liabilitas','ekuitas','pendapatan','beban'];
const TIPE_LBL={aset:'Aset',liabilitas:'Liabilitas',ekuitas:'Ekuitas',pendapatan:'Pendapatan',beban:'Beban'};
const normalOf=t=>(t==='aset'||t==='beban')?'D':'K';
const DEF_COA=[
['1100','Kas','aset','D',1],['1200','Bank','aset','D',1],['1300','Piutang Usaha','aset','D',0],['1400','Persediaan Barang','aset','D',0],
['1500','Perlengkapan','aset','D',0],['1600','Peralatan','aset','D',0],['1690','Akumulasi Penyusutan Peralatan','aset','K',0],
['2100','Utang Usaha','liabilitas','K',0],['2200','Utang Bank','liabilitas','K',0],['2300','Utang Gaji','liabilitas','K',0],
['3100','Modal Pemilik','ekuitas','K',0],['3200','Prive','ekuitas','D',0],
['4100','Penjualan','pendapatan','K',0],['4200','Pendapatan Lain','pendapatan','K',0],
['5100','Harga Pokok Penjualan','beban','D',0],['5200','Beban Gaji','beban','D',0],['5300','Beban Sewa','beban','D',0],
['5400','Beban Listrik dan Air','beban','D',0],['5500','Beban Penyusutan','beban','D',0],['5900','Beban Lain-lain','beban','D',0]];
const mkCoa=()=>DEF_COA.map(([kode,nama,tipe,normal,kas])=>({kode,nama,tipe,normal,kas:!!kas}));

/* ---------- util ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>{n=Math.round(n||0);const s=Math.abs(n).toLocaleString('id-ID');return n<0?'('+s+')':s};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=(n,w)=>String(n).padStart(w||2,'0');
const today=()=>{const t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())};
const byKode=(a,b)=>String(a.kode).localeCompare(String(b.kode),'id',{numeric:true});
const tglId=s=>{if(!s)return '';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
function num(v){
  if(typeof v==='number')return isFinite(v)?v:NaN;
  let s=String(v==null?'':v).replace(/[^\d.,-]/g,'');
  if(!s)return String(v==null?'':v).trim()===''?0:NaN;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');
  else s=s.replace(',','.');
  const x=parseFloat(s);return isNaN(x)?NaN:x;
}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3200)}

/* ---------- data ---------- */
let S;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function migrate(s){ /* tempat migrasi data antarversi: v1.0 belum ada yang perlu dimigrasi */ s.ver=VER;return s}
function sample(){
  const J=(tgl,no,ket,rows)=>rows.map(([akun,d,k])=>({tgl,no,ket,akun,d,k}));
  const jurnal=[].concat(
    J('2026-11-01','SA-01','Saldo awal',[['1100',20000000,0],['1400',15000000,0],['1600',5000000,0],['3100',0,40000000]]),
    J('2026-11-03','KM-001','Penjualan tunai',[['1100',3500000,0],['4100',0,3500000]]),
    J('2026-11-03','JU-001','HPP penjualan tunai',[['5100',2000000,0],['1400',0,2000000]]),
    J('2026-11-05','KK-001','Bayar sewa toko',[['5300',1500000,0],['1100',0,1500000]]),
    J('2026-11-07','JU-002','Penjualan kredit',[['1300',2400000,0],['4100',0,2400000]]),
    J('2026-11-07','JU-003','HPP penjualan kredit',[['5100',1400000,0],['1400',0,1400000]]),
    J('2026-11-10','JU-004','Beli barang secara kredit',[['1400',5000000,0],['2100',0,5000000]]),
    J('2026-11-12','KK-002','Bayar gaji karyawan',[['5200',2000000,0],['1100',0,2000000]])
  ).map(l=>Object.assign({id:uid()},l));
  return{id:uid(),nama:'Usaha Contoh',demo:true,coa:mkCoa(),jurnal};
}
S=load();
if(!S||!Array.isArray(S.perusahaan))S={ver:VER,aktif:'',perusahaan:[]};
S=migrate(S);
const C=()=>S.perusahaan.find(p=>p.id===S.aktif)||S.perusahaan[0];

/* ---------- perhitungan akuntansi ---------- */
function sums(c,from,to){
  const m={};c.coa.forEach(a=>{m[a.kode]={d:0,k:0}});
  c.jurnal.forEach(l=>{
    if(from&&l.tgl<from)return; if(to&&l.tgl>to)return;
    const x=m[l.akun]; if(x){x.d+=l.d;x.k+=l.k}
  });
  return m;
}
function dataNS(c,to){
  const m=sums(c,'',to);const rows=[];let td=0,tk=0;
  c.coa.slice().sort(byKode).forEach(a=>{
    const x=m[a.kode]; if(!x.d&&!x.k)return;
    const n=x.d-x.k, d=n>0?n:0, k=n<0?-n:0; td+=d;tk+=k; rows.push([a.kode,a.nama,d,k]);
  });
  return{rows,td,tk};
}
function groupVal(c,m,tipe){
  return c.coa.filter(a=>a.tipe===tipe).sort(byKode).map(a=>{
    const x=m[a.kode];return[a.kode,a.nama,normalOf(tipe)==='D'?x.d-x.k:x.k-x.d];
  }).filter(r=>Math.round(r[2])!==0);
}
const tot=r=>r.reduce((s,x)=>s+x[2],0);
function dataLR(c,from,to){
  const m=sums(c,from,to), p=groupVal(c,m,'pendapatan'), b=groupVal(c,m,'beban');
  return{p,b,tp:tot(p),tb:tot(b),laba:tot(p)-tot(b)};
}
function dataNR(c,to){
  const m=sums(c,'',to);
  const a=groupVal(c,m,'aset'),l=groupVal(c,m,'liabilitas'),e=groupVal(c,m,'ekuitas');
  const laba=tot(groupVal(c,m,'pendapatan'))-tot(groupVal(c,m,'beban'));
  const TA=tot(a),TL=tot(l),TE=tot(e)+laba;
  return{a,l,e,laba,TA,TL,TE,selisih:Math.round(TA-TL-TE)};
}
function dataBB(c,kode,from,to){
  const a=c.coa.find(x=>x.kode===kode); if(!a)return null;
  const sg=(d,k)=>a.normal==='D'?d-k:k-d;
  let run=0; if(from)c.jurnal.forEach(l=>{if(l.akun===kode&&l.tgl<from)run+=sg(l.d,l.k)});
  const awal=run, rows=[];
  c.jurnal.filter(l=>l.akun===kode&&(!from||l.tgl>=from)&&(!to||l.tgl<=to))
    .sort((x,y)=>(x.tgl+x.no).localeCompare(y.tgl+y.no)).forEach(l=>{run+=sg(l.d,l.k);rows.push([l.tgl,l.no,l.ket,l.d,l.k,run])});
  return{a,awal,rows,akhir:run};
}
function dataKas(c,from,to){
  return c.coa.filter(a=>a.kas).sort(byKode).map(a=>{
    let awal=0,masuk=0,keluar=0;
    c.jurnal.forEach(l=>{
      if(l.akun!==a.kode)return;
      if(from&&l.tgl<from)awal+=l.d-l.k;
      else if(!to||l.tgl<=to){masuk+=l.d;keluar+=l.k}
    });
    return[a.kode,a.nama,awal,masuk,keluar,awal+masuk-keluar];
  });
}
function buktiList(c){
  const g={};
  c.jurnal.forEach(l=>{(g[l.no]=g[l.no]||{no:l.no,tgl:l.tgl,ket:l.ket,lines:[]}).lines.push(l)});
  return Object.values(g).sort((a,b)=>(b.tgl+b.no).localeCompare(a.tgl+a.no));
}
function nextNo(c){
  const n=new Set(c.jurnal.map(l=>l.no));let i=n.size+1,no;
  do{no='JU-'+pad(i,3);i++}while(n.has(no));return no;
}

/* ---------- impor / ekspor Excel ---------- */
const TIPE_ALIAS={aset:'aset',harta:'aset',liabilitas:'liabilitas',kewajiban:'liabilitas',utang:'liabilitas',hutang:'liabilitas',
  ekuitas:'ekuitas',modal:'ekuitas',pendapatan:'pendapatan',penghasilan:'pendapatan',pendapatanusaha:'pendapatan',beban:'beban',biaya:'beban'};
const hnorm=h=>String(h==null?'':h).toLowerCase().replace(/[^a-z]/g,'');
function parseTgl(v){
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*3600e3);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  if(typeof v==='number'&&v>20000&&v<80000){return new Date(Math.round((v-25569)*86400e3)).toISOString().slice(0,10)}
  const s=String(v||'').trim(); let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if(m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  return '';
}
function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T12:00:00Z');return !isNaN(d)&&d.toISOString().slice(0,10)===s}
function readSheet(ws,spec){
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  if(!rows.length)return{items:[],miss:['(sheet kosong)']};
  const head=rows[0].map(hnorm), idx={}, miss=[];
  for(const [key,names,wajib] of spec){
    const i=head.findIndex(h=>names.includes(h)); idx[key]=i;
    if(i<0&&wajib)miss.push(names[0]);
  }
  const items=[];
  for(let r=1;r<rows.length;r++){
    const row=rows[r]; if(row.every(x=>x===''||x==null))continue;
    const it={_r:r+1}; for(const k in idx)it[k]=idx[k]>=0?row[idx[k]]:''; items.push(it);
  }
  return{items,miss};
}
function analisisImpor(c,wb){
  const err=[], res={akun:[],jurnal:[],ada:{akun:false,jurnal:false}};
  const nm={};wb.SheetNames.forEach(n=>nm[hnorm(n)]=n);
  const sn=Object.keys(nm).find(k=>k.includes('jurnal')), sa=Object.keys(nm).find(k=>k.includes('akun')||k.includes('coa'));
  if(!sn&&!sa)return{err:['Tidak ada sheet bernama "Akun" atau "Jurnal". Unduh template dulu supaya formatnya pas.'],res};
  const coa=new Map(c.coa.map(a=>[a.kode,Object.assign({},a)]));
  if(sa){
    res.ada.akun=true;
    const {items,miss}=readSheet(wb.Sheets[nm[sa]],[['kode',['kode','kodeakun'],1],['nama',['namaakun','nama','namaperkiraan'],1],['tipe',['tipe','jenis','kelompok'],1],['normal',['saldonormal','normal'],0],['kas',['kas','akunkas'],0]]);
    if(miss.length)err.push('Sheet Akun: kolom '+miss.join(', ')+' tidak ditemukan.');
    else items.forEach(it=>{
      const kode=String(it.kode).trim(), nama=String(it.nama).trim(), tipe=TIPE_ALIAS[hnorm(it.tipe)];
      if(!kode||!nama){err.push('Akun baris '+it._r+': kode atau nama kosong.');return}
      if(!tipe){err.push('Akun baris '+it._r+': tipe "'+it.tipe+'" tidak dikenal (pakai Aset, Liabilitas, Ekuitas, Pendapatan, atau Beban).');return}
      let nrm=hnorm(it.normal); nrm=nrm.startsWith('d')?'D':nrm.startsWith('k')?'K':normalOf(tipe);
      const kas=['ya','y','1','true','kas'].includes(hnorm(it.kas)||String(it.kas).toLowerCase());
      coa.set(kode,{kode,nama,tipe,normal:nrm,kas});res.akun.push(kode);
    });
  }
  if(sn){
    res.ada.jurnal=true;
    const {items,miss}=readSheet(wb.Sheets[nm[sn]],[['tgl',['tanggal','tgl'],1],['no',['nobukti','nojurnal','no','bukti'],1],['ket',['keterangan','ket','uraian'],0],['akun',['kodeakun','akun','kode'],1],['d',['debit','d'],1],['k',['kredit','k'],1]]);
    if(miss.length)err.push('Sheet Jurnal: kolom '+miss.join(', ')+' tidak ditemukan.');
    else{
      const ada=new Set(c.jurnal.map(l=>l.no)), tiap={};
      items.forEach(it=>{
        const tgl=parseTgl(it.tgl), no=String(it.no).trim(), akun=String(it.akun).trim(), d=num(it.d===''?0:it.d), k=num(it.k===''?0:it.k);
        let bad=false; const e=m=>{err.push('Jurnal baris '+it._r+': '+m);bad=true};
        if(!validDate(tgl))e('tanggal "'+it.tgl+'" tidak valid (pakai format tahun-bulan-tanggal, misal 2026-11-14).');
        if(!no)e('nomor bukti kosong.'); else if(ada.has(no))e('nomor bukti '+no+' sudah ada di perusahaan ini (kemungkinan sudah pernah diimpor).');
        if(!coa.has(akun))e('kode akun "'+akun+'" tidak ada di daftar akun.');
        if(isNaN(d)||isNaN(k)||d<0||k<0)e('debit/kredit harus angka positif.');
        else if(d>0&&k>0)e('debit dan kredit tidak boleh terisi bersamaan.');
        else if(d===0&&k===0)e('debit dan kredit sama-sama kosong.');
        if(bad)return;
        const t=tiap[no]=tiap[no]||{d:0,k:0,baris:it._r}; t.d+=d;t.k+=k;
        res.jurnal.push({id:uid(),tgl,no,ket:String(it.ket||'').trim(),akun,d,k});
      });
      Object.keys(tiap).forEach(no=>{const t=tiap[no];if(Math.round(t.d-t.k)!==0)err.push('Bukti '+no+' tidak seimbang: debit '+rp(t.d)+', kredit '+rp(t.k)+' (mulai baris '+t.baris+').')});
    }
  }
  res.coa=[...coa.values()];
  return{err,res};
}

}

function updateBal(){
  const el=$('#bal'); if(!el||!draft)return;
  let d=0,k=0,ok=true,used=0;
  draft.lines.forEach(l=>{const x=num(l.d||0),y=num(l.k||0);if(isNaN(x)||isNaN(y)||x<0||y<0)ok=false;d+=x||0;k+=y||0;
    if((x||y)){used++;if(!l.akun||(x&&y))ok=false}});
  const sel=Math.round(d-k), balanced=sel===0&&d>0&&ok&&used>=2;
  el.className='bal '+(balanced?'ok':'bad');
  el.textContent='Debit '+rp(d)+'  |  Kredit '+rp(k)+'  |  '+(sel===0?(d>0?'Seimbang':'Isi jumlahnya'):'Selisih '+rp(Math.abs(sel)))+(d===k&&d>0&&!ok?'  |  Cek akun atau angka':'');
  const b=$('#simpanj'); if(b)b.disabled=!balanced;
}

      '<tr class="tot"><td>Total</td>'+[2,3,4,5].map(i=>'<td class="n">'+rp(r.reduce((s,x)=>s+x[i],0))+'</td>').join('')+'</tr></tbody></table></div>':'<div class="muted">Belum ada akun yang ditandai sebagai kas atau bank.</div>');
  }
  return '<div class="card"><div class="grid2"><label>Dari tanggal<input type="date" id="r-dari" value="'+R.dari+'"></label><label>Sampai tanggal<input type="date" id="r-sampai" value="'+R.sampai+'"></label></div>'+
    '<div class="row" style="margin-top:10px">'+subs.map(([k,l])=>'<button class="chip'+(R.sub===k?' on':'')+'" data-act="sub" data-id="'+k+'">'+l+'</button>').join('')+'</div></div>'+
    '<div class="card">'+body+'</div>';
}

function vExcel(){
  const ready=typeof XLSX!=='undefined';
  return '<div class="card"><h2>Alur kerja Excel</h2><ol class="log" style="padding-left:20px"><li>Unduh template, isi akun dan jurnal di Excel.</li><li>Impor file ke perusahaan aktif: <b>'+esc(C().nama)+'</b>.</li><li>Lihat laporan, lalu ekspor sebagai file Excel.</li></ol>'+
    (ready?'':'<div class="msg bad" style="margin-top:10px">Pustaka Excel belum termuat. Perlu koneksi internet saat pertama membuka aplikasi.</div>')+'</div>'+
  '<div class="card"><h2>Impor dari Excel</h2><div style="display:flex;flex-direction:column;gap:8px">'+
    '<button data-act="template">Unduh template Excel</button>'+
    '<label>Pilih file .xlsx<input type="file" id="x-file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label>'+
    (importMsg||'')+'</div></div>'+
  '<div class="card"><h2>Ekspor ke Excel</h2><div style="display:flex;flex-direction:column;gap:8px">'+
    '<div class="muted">Berisi akun, jurnal umum, neraca saldo, laba rugi, neraca, kas dan bank, serta buku besar, memakai periode di menu Laporan. File ini bisa diimpor kembali sebagai cadangan.</div>'+
    '<button class="pri" data-act="ekspor">Unduh laporan lengkap (.xlsx)</button>'+
    '<div class="muted">Jika unduhan tidak jalan, buka aplikasi lewat Chrome (alamat web atau ikon aplikasi yang terpasang).</div></div></div>';
}

/* ---------- interaksi ---------- */
document.addEventListener('click',e=>{
  const nb=e.target.closest('[data-tab]'); if(nb){tab=nb.dataset.tab;armed='';importMsg=importMsg&&tab==='excel'?importMsg:'';render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]'); if(!b)return;
  const act=b.dataset.act, id=b.dataset.id||'', key=act+':'+id, c=C();
  if(/^hapus/.test(act)){ if(armed!==key){armed=key;render();return} armed=''; }
  else armed='';
  if(act==='pilih'){S.aktif=id;draft=null;save();render()}
  else if(act==='tambahp'){
    const n=($('#p-nama').value||'').trim(); if(!n){toast('Isi nama perusahaan.');return}
    const pertama=!S.perusahaan.length;const p={id:uid(),nama:n,coa:mkCoa(),jurnal:[]};S.perusahaan.push(p);S.aktif=p.id;draft=null;if(pertama)tab='jurnal';save();toast('Perusahaan dibuat');render();
  }
  else if(act==='hapusp'){S.perusahaan=S.perusahaan.filter(p=>p.id!==id);S.aktif=S.perusahaan.length?(S.aktif===id?S.perusahaan[0].id:S.aktif):'';draft=null;tab='perusahaan';save();render()}
  else if(act==='contoh'){const p=sample();S.perusahaan.push(p);S.aktif=p.id;draft=null;tab='laporan';save();render()}
  else if(act==='baris'){draft.lines.push({akun:'',d:'',k:''});render()}
  else if(act==='simpanj')simpanJurnal();
  else if(act==='hapusj'){c.jurnal=c.jurnal.filter(l=>l.no!==id);save();render()}
  else if(act==='hapusa'){c.coa=c.coa.filter(a=>a.kode!==id);save();render()}
  else if(act==='tambaha'){
    const kode=($('#a-kode').value||'').trim(), nama=($('#a-nama').value||'').trim(), tipe=$('#a-tipe').value;
    if(!kode||!nama){toast('Isi kode dan nama akun.');return}
    if(c.coa.some(a=>a.kode===kode)){toast('Kode '+kode+' sudah ada.');return}
    c.coa.push({kode,nama,tipe,normal:normalOf(tipe),kas:$('#a-kas').checked});save();toast('Akun ditambahkan');render();
  }
  else if(act==='sub'){R.sub=id;render()}
  else if(act==='template')unduhTemplate();
  else if(act==='ekspor')unduhLaporan();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-tgl'){draft.tgl=t.value;return} if(t.id==='f-no'){draft.no=t.value;return} if(t.id==='f-ket'){draft.ket=t.value;return}
  if(t.dataset&&t.dataset.f){const l=draft.lines[+t.dataset.i];l[t.dataset.f]=t.value;
    if(t.dataset.f==='d'&&t.value)l.k=''; if(t.dataset.f==='k'&&t.value)l.d='';
    if((t.dataset.f==='d'||t.dataset.f==='k')){const row=t.parentElement;row.querySelectorAll('input').forEach(i=>{if(i.dataset.f!==t.dataset.f&&t.value)i.value=''})}
    updateBal();return}
  if(t.id==='r-dari'){R.dari=t.value;render()} else if(t.id==='r-sampai'){R.sampai=t.value;render()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='sw'){S.aktif=t.value;draft=null;armed='';save();render();return}
  if(t.id==='r-akun'){R.akun=t.value;render();return}
  if(t.id==='x-file'&&t.files[0])bacaFile(t.files[0]);
});
function bacaFile(f){
  if(typeof XLSX==='undefined'){importMsg='<div class="msg bad">Pustaka Excel belum termuat. Cek koneksi internet lalu muat ulang.</div>';render();return}
  const rd=new FileReader();
  rd.onerror=()=>{importMsg='<div class="msg bad">File tidak bisa dibaca.</div>';render()};
  rd.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
      const c=C(), {err,res}=analisisImpor(c,wb);
      if(err.length){
        importMsg='<div class="msg bad"><b>Impor dibatalkan, ada '+err.length+' masalah. Tidak ada data yang diubah.</b><ul>'+err.slice(0,25).map(x=>'<li>'+esc(x)+'</li>').join('')+(err.length>25?'<li>dan '+(err.length-25)+' masalah lain.</li>':'')+'</ul></div>';
      }else{
        c.coa=res.coa; c.jurnal.push(...res.jurnal); if(c.demo&&res.jurnal.length)c.demo=false; save();
        importMsg='<div class="msg ok"><b>Impor berhasil</b><ul><li>'+res.akun.length+' akun diproses</li><li>'+res.jurnal.length+' baris jurnal ditambahkan ('+new Set(res.jurnal.map(l=>l.no)).size+' bukti)</li></ul></div>';
        draft=null;
      }
    }catch(x){importMsg='<div class="msg bad">File tidak bisa dibuka sebagai Excel. Pastikan formatnya .xlsx. ('+esc(x.message||x)+')</div>'}
    render();
  };
  rd.readAsArrayBuffer(f);
}
render();
try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
