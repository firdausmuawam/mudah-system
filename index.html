function fmtInput(el){
  const raw=el.value,pos=el.selectionStart==null?raw.length:el.selectionStart;
  const before=raw.slice(0,pos).replace(/[^\d,]/g,'').length;
  const s=raw.replace(/[^\d,]/g,''),i=s.indexOf(',');
  let ip=i<0?s:s.slice(0,i),dp=i<0?null:s.slice(i+1).replace(/,/g,'').slice(0,2);
  ip=ip.replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  const out=ip+(dp!==null?','+dp:'');
  el.value=out;let c=0,p=0;while(p<out.length&&c<before){if(/[\d,]/.test(out[p]))c++;p++}
  try{el.setSelectionRange(p,p)}catch(e){}
}
function num(v){
  if(typeof v==='number')return isFinite(v)?v:NaN;
  let s=String(v==null?'':v).replace(/[^\d.,-]/g,'');
  if(!s)return String(v==null?'':v).trim()===''?0:NaN;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');
  else s=s.replace(',','.');
  const x=parseFloat(s);return isNaN(x)?NaN:x;
}

function blank(c){const m={};c.coa.forEach(a=>{m[a.kode]={d:0,k:0}});return m}
function sums(c,from,to){const m=blank(c);c.jurnal.forEach(l=>{if(from&&l.tgl<from)return;if(to&&l.tgl>to)return;const x=m[l.akun];if(x){x.d+=l.d;x.k+=l.k}});return m}
function before(c,from){const m=blank(c);if(!from)return m;c.jurnal.forEach(l=>{if(l.tgl<from){const x=m[l.akun];if(x){x.d+=l.d;x.k+=l.k}}});return m}
const gv=(a,x)=>sectD(sect(a))?x.d-x.k:x.k-x.d;
const rowsOf=(c,m,tipe,sc)=>c.coa.filter(a=>a.tipe===tipe&&(!sc||sect(a)===sc)).sort(byKode).map(a=>[a.kode,a.nama,r2(gv(a,m[a.kode]))]).filter(r=>r[2]);
const tot=r=>r2(r.reduce((s,x)=>s+x[2],0));
function dataTB(c,from,to){
  const a0=before(c,from),m=sums(c,from,to),rows=[],T=[0,0,0,0,0,0];
  c.coa.slice().sort(byKode).forEach(ac=>{
    const x=a0[ac.kode],y=m[ac.kode],an=r2(x.d-x.k),sn=r2(an+y.d-y.k);
    if(!an&&!r2(y.d)&&!r2(y.k))return;
    const r=[ac.kode,ac.nama,an>0?an:0,an<0?-an:0,r2(y.d),r2(y.k),sn>0?sn:0,sn<0?-sn:0];
    r.slice(2).forEach((v,i)=>{T[i]=r2(T[i]+v)});rows.push(r);
  });
  return{rows,T,ok:T[0]===T[1]&&T[2]===T[3]&&T[4]===T[5]};
}
function dataLR(c,from,to){
  const m=sums(c,from,to),p=[],b=[];
  TIPE.filter(t=>t==='pendapatan').forEach(t=>p.push(...rowsOf(c,m,t)));
  b.push(...rowsOf(c,m,'beban'));
  const tp=tot(p),tb=tot(b);return{p,b,tp,tb,laba:r2(tp-tb)};
}
const GA=[['Aset Lancar','lancar'],['Piutang','piutang'],['Prepaid (Dibayar di Muka)','prepaid'],['Aktiva Tetap','tetap'],['Pajak Dibayar di Muka / PPN Masukan','pajak','aset']];
const GL=[['Hutang','hutang'],['Pajak (Utang Pajak)','pajak','liabilitas']];
function dataNR(c,to){
  const m=sums(c,'',to);
  const grp=(L)=>L.map(([t,tp,sc])=>({t,rows:rowsOf(c,m,tp,sc)})).filter(g=>g.rows.length);
  const A=grp(GA),L=grp(GL),E=grp([['Ekuitas','ekuitas']]);
  const laba=dataLR(c,'',to).laba,sm=g=>r2(g.reduce((s,x)=>s+tot(x.rows),0));
  const TA=sm(A),TL=sm(L),TE=r2(sm(E)+laba);
  return{A,L,E,laba,TA,TL,TE,selisih:r2(TA-TL-TE)};
}
function dataSub(c,jenis,kode,from,to){
  const set=new Set(c.coa.filter(a=>a.tipe===jenis&&(!kode||a.kode===kode)).map(a=>a.kode)),g={};
  c.jurnal.forEach(l=>{
    if(!set.has(l.akun)||(to&&l.tgl>to))return;
    const nm=(l.mitra||'').trim(),key=nm.toLowerCase();
    const o=g[key]=g[key]||{nama:nm||'(Tanpa mitra)',ad:0,md:0,mk:0,kosong:!nm};
    if(from&&l.tgl<from)o.ad+=l.d-l.k;else{o.md+=l.d;o.mk+=l.k}
  });
  const sg=jenis==='piutang'?1:-1,rows=[];
  Object.values(g).sort((x,y)=>x.kosong-y.kosong||x.nama.localeCompare(y.nama,'id')).forEach(o=>{
    const aw=r2(sg*o.ad),ak=r2(sg*(o.ad+o.md-o.mk));
    if(aw||r2(o.md)||r2(o.mk)||ak)rows.push([o.nama,aw,r2(o.md),r2(o.mk),ak,o.kosong]);
  });
  const T=[1,2,3,4].map(i=>r2(rows.reduce((s,r)=>s+r[i],0)));
  return{rows,T,tanpa:rows.some(r=>r[5]&&r[4]!==0)};
}
function dataBB(c,kode,from,to){
  const a=c.coa.find(x=>x.kode===kode);if(!a)return null;
  const sg=(d,k)=>a.normal==='D'?d-k:k-d;let run=0;
  if(from)c.jurnal.forEach(l=>{if(l.akun===kode&&l.tgl<from)run+=sg(l.d,l.k)});
  const awal=r2(run),rows=[];
  c.jurnal.filter(l=>l.akun===kode&&(!from||l.tgl>=from)&&(!to||l.tgl<=to)).sort((x,y)=>(x.tgl+x.no).localeCompare(y.tgl+y.no)).forEach(l=>{
    run+=sg(l.d,l.k);
    rows.push([l.tgl,l.no,[l.ket,l.memo,l.mitra?'['+l.mitra+']':''].filter(Boolean).join(' - '),l.d,l.k,r2(run)]);
  });
  return{a,awal,rows,akhir:r2(run)};
}
function dataKas(c,from,to){

    c.jurnal.forEach(l=>{if(l.akun!==a.kode)return;if(from&&l.tgl<from)awal+=l.d-l.k;else if(!to||l.tgl<=to){masuk+=l.d;keluar+=l.k}});

}

}
function nextNo(c,pre){const used=new Set(c.jurnal.map(l=>l.no));let i=used.size+1,no;do{no=(pre||'JU')+'-'+pad(i,3);i++}while(used.has(no));return no}
const noTaken=(c,no,self)=>c.jurnal.some(l=>l.no===no&&!(self&&l.no===self));
function kodeUsed(c,kode){

function mitraNames(c){

  c.jurnal.forEach(l=>add(l.mitra));c.penjualan.concat(c.pembelian,c.stok,c.aset).forEach(p=>add(p.mitra));

}
const trxTot=p=>{let t=0;p.items.forEach(i=>{t+=r2(i.qty*i.harga)});t=r2(t);const ppn=r2(t*(p.ppn||0)/100);return{tot:t,ppn,g:r2(t+ppn)}};

/* ---------- stok rata-rata bergerak ---------- */
const bOf=(c,sel)=>{if(!sel||sel.slice(0,2)!=='b:')return null;const id=sel.slice(2);return c.barang.some(b=>b.id===id)?id:null};
function replay(c){
  const ev=[];let i=0;
  c.pembelian.forEach(p=>p.items.forEach((it,x)=>{const b=bOf(c,it.sel);if(b)ev.push({tgl:p.tgl,o:i++,in:1,b,q:it.qty,h:it.harga,key:p.id+':'+x,ref:p.no,ket:'Pembelian '+p.no,sm:'Pembelian'})}));
  c.stok.forEach(s=>{if(c.barang.some(z=>z.id===s.barang))ev.push({tgl:s.tgl,o:i++,in:s.jenis==='masuk'?1:0,b:s.barang,q:s.qty,h:s.harga,key:s.id,ref:s.no,ket:s.ket||('Stok '+s.jenis),sm:'Persediaan'})});
  c.penjualan.forEach(p=>p.items.forEach((it,x)=>{const b=bOf(c,it.sel);if(b)ev.push({tgl:p.tgl,o:i++,in:0,b,q:it.qty,key:p.id+':'+x,ref:p.no,ket:'Penjualan '+p.no,sm:'Penjualan'})}));
  ev.sort((a,b)=>a.tgl<b.tgl?-1:a.tgl>b.tgl?1:(b.in-a.in)||a.o-b.o);
  const st={},cost={},kartu={};
  c.barang.forEach(b=>{st[b.id]={q:0,v:0,last:0,neg:false};kartu[b.id]=[]});
  ev.forEach(e=>{
    const s=st[e.b];let nilai;
    if(e.in){nilai=r2(e.q*e.h);s.q+=e.q;s.v=r2(s.v+nilai);s.last=e.h}
    else{
      const avg=s.q>0?s.v/s.q:s.last;nilai=r2(e.q*avg);
      if(s.q>0&&e.q>=s.q-1e-9)nilai=r2(s.v);
      if(e.q>s.q+1e-9)s.neg=true;
      s.q=s.q-e.q;s.v=r2(s.v-nilai);if(Math.abs(s.q)<1e-9){s.q=0;s.v=0}
    }
    cost[e.key]=nilai;
    kartu[e.b].push({tgl:e.tgl,ref:e.ref,ket:e.ket,sm:e.sm,masuk:e.in?e.q:0,keluar:e.in?0:e.q,nilai:e.in?nilai:-nilai,sq:s.q,sv:s.v});
  });
  return{st,cost,kartu};
}

/* ---------- penyusutan aktiva tetap (garis lurus, bulanan) ---------- */
function susutJadwal(a,until){
  const n=a.umur|0,base=r2((+a.harga||0)-(+a.residu||0));
  if(!n||!a.tgl||base<=0)return[];
  const m=r2(base/n),s={y:+a.tgl.slice(0,4),m:+a.tgl.slice(5,7)},out=[],lim=until?ymKey(until):Infinity;
  for(let k=(a.sudah|0);k<n;k++){
    const p=addM(s,k);if(p.y*12+p.m>lim)break;
    out.push({k:k+1,ym:p.y+'-'+pad(p.m),tgl:eom(p.y,p.m),amt:k===n-1?r2(base-m*(n-1)):m});
  }
  return out;
}
function asetRingkas(a,until){
  const n=a.umur|0,base=r2((+a.harga||0)-(+a.residu||0)),m=n?r2(base/n):0;
  const post=susutJadwal(a,until).reduce((s,x)=>s+x.amt,0),pre=r2(Math.min(base,m*(a.sudah|0)));
  const akum=r2(pre+post);return{m,akum,buku:r2((+a.harga||0)-akum),sisa:Math.max(0,n-(a.sudah|0)-susutJadwal(a,until).length)};
}

/* ---------- jurnal otomatis dari menu transaksi ---------- */
function rebuild(c){
  c.jurnal=c.jurnal.filter(l=>l.src==='manual'||l.src==='saldo');
  const M=c.map,R=replay(c),out=[];
  const J=(no,tgl,ket,akun,d,k,ex)=>{d=r2(d);k=r2(k);if(!akun||(!d&&!k))return;out.push(Object.assign({id:uid(),no,tgl,ket,memo:'',akun,d,k,mitra:''},ex))};
  c.penjualan.forEach(p=>{
    const t=trxTot(p),tn=p.bayar==='tunai',ex={src:'jual',ref:p.id},ket=p.ket||('Penjualan '+p.no);
    J(p.no,p.tgl,ket,tn?(p.akunKas||M.kas):M.piutang,t.g,0,Object.assign({mitra:tn?'':p.mitra,memo:tn?(p.mitra||''):''},ex));
    p.items.forEach((it,x)=>{
      const b=bOf(c,it.sel),ak=b?M.penjualan:((it.sel||'').slice(2)||M.penjualan);
      J(p.no,p.tgl,ket,ak,0,r2(it.qty*it.harga),Object.assign({memo:it.uraian||''},ex));
      if(b){const h=R.cost[p.id+':'+x]||0;J(p.no,p.tgl,ket,M.hpp,h,0,Object.assign({memo:'HPP '+(it.uraian||'')},ex));J(p.no,p.tgl,ket,M.persediaan,0,h,Object.assign({memo:'HPP '+(it.uraian||'')},ex))}
    });
    J(p.no,p.tgl,ket,M.ppnK,0,t.ppn,Object.assign({memo:'PPN '+(p.ppn||0)+'%'},ex));
  });
  c.pembelian.forEach(p=>{
    const t=trxTot(p),tn=p.bayar==='tunai',ex={src:'beli',ref:p.id},ket=p.ket||('Pembelian '+p.no);
    p.items.forEach(it=>{const b=bOf(c,it.sel),ak=b?M.persediaan:((it.sel||'').slice(2)||M.persediaan);J(p.no,p.tgl,ket,ak,r2(it.qty*it.harga),0,Object.assign({memo:it.uraian||''},ex))});
    J(p.no,p.tgl,ket,M.ppnM,t.ppn,0,Object.assign({memo:'PPN '+(p.ppn||0)+'%'},ex));
    J(p.no,p.tgl,ket,tn?(p.akunKas||M.kas):M.hutang,0,t.g,Object.assign({mitra:tn?'':p.mitra,memo:tn?(p.mitra||''):''},ex));
  });
  c.stok.forEach(s=>{
    const b=c.barang.find(z=>z.id===s.barang);if(!b)return;
    const ex={src:'stok',ref:s.id},ket=s.ket||((s.jenis==='masuk'?'Barang masuk ':'Barang keluar ')+b.nama),v=R.cost[s.id]||0;
    if(s.jenis==='masuk'){
      J(s.no,s.tgl,ket,M.persediaan,v,0,Object.assign({memo:b.nama+' x '+s.qty},ex));
      J(s.no,s.tgl,ket,s.bayar==='tunai'?M.kas:M.hutang,0,v,Object.assign({mitra:s.bayar==='tunai'?'':s.mitra,memo:s.bayar==='tunai'?(s.mitra||''):''},ex));
    }else{
      J(s.no,s.tgl,ket,M.beban,v,0,Object.assign({memo:b.nama+' x '+s.qty},ex));
      J(s.no,s.tgl,ket,M.persediaan,0,v,Object.assign({memo:b.nama+' x '+s.qty},ex));
    }
  });
  c.aset.forEach(a=>{
    const ex={src:'aset',ref:a.id};
    if(a.perolehan==='kas'||a.perolehan==='hutang'){
      const no='AT-'+a.kode;
      J(no,a.tgl,'Perolehan '+a.nama,a.akun,a.harga,0,ex);
      J(no,a.tgl,'Perolehan '+a.nama,a.perolehan==='kas'?M.kas:M.hutang,0,a.harga,Object.assign({mitra:a.perolehan==='hutang'?a.mitra:''},ex));
    }
    susutJadwal(a,today()).forEach(x=>{
      const no='DEP-'+x.ym.replace('-','')+'-'+a.kode,ket='Penyusutan '+a.nama+' '+x.ym;
      J(no,x.tgl,ket,a.beban||M.susut,x.amt,0,Object.assign({src:'susut'},{ref:a.id}));
      J(no,x.tgl,ket,a.akum,0,x.amt,{src:'susut',ref:a.id});
    });
  });
  c.jurnal.push(...out);
}

let _db;
function idb(){return _db||(_db=new Promise((res,rej)=>{try{const r=indexedDB.open('id-os-umkum',1);r.onupgradeneeded=()=>r.result.createObjectStore('lamp',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))}
const idbTx=(m,fn)=>idb().then(db=>new Promise((res,rej)=>{const t=db.transaction('lamp',m),q=fn(t.objectStore('lamp'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
const idbPut=o=>idbTx('readwrite',s=>s.put(o)),idbGet=id=>idbTx('readonly',s=>s.get(id)),idbDel=id=>idbTx('readwrite',s=>s.delete(id));
function kompres(file,max,q){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);

function parseTgl(v){
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*3600e3);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  if(typeof v==='number'&&v>20000&&v<80000)return new Date(Math.round((v-25569)*86400e3)).toISOString().slice(0,10);
  const s=String(v||'').trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if(m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  return '';

function readSheet(ws,spec){
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  if(!rows.length)return{items:[],miss:['(sheet kosong)']};
  const head=rows[0].map(hnorm),idx={},miss=[];
  for(const [key,names,wajib] of spec){const i=head.findIndex(h=>names.includes(h));idx[key]=i;if(i<0&&wajib)miss.push(names[0])}
  const items=[];
  for(let r=1;r<rows.length;r++){const row=rows[r];if(row.every(x=>x===''||x==null))continue;const it={_r:r+1};for(const k in idx)it[k]=idx[k]>=0?row[idx[k]]:'';items.push(it)}
  return{items,miss};
}

  return ws;
}

function jline(k,i,l,memo,n){
  const c=C(),a=c.coa.find(x=>x.kode===l.akun),p=k+'.lines.'+i+'.';
  return '<div class="jl"><div class="w">'+iSel(p+'akun',akunOpts(c),l.akun,1)+'</div>'+fld('Debit',iRp(p+'d',l.d))+fld('Kredit',iRp(p+'k',l.k))+
    (memo?fld('Keterangan baris',iText(p+'memo',l.memo,'Opsional'),'w'):'')+
    (isSub(a)?fld('Nama '+(a.tipe==='piutang'?'pelanggan / debitur':'pemasok / kreditur'),iText(p+'mitra',l.mitra,'Untuk sub ledger','list="dl-mitra"'),'w'):'')+
    (n>2?'<div class="w"><button class="sm dng" data-act="rmbaris" data-id="'+k+':'+i+'">Hapus baris</button></div>':'')+'</div>';
}
function balInfo(lines){
  let d=0,k=0,used=0,ok=true,nm=0;const c=C();
  lines.forEach(l=>{const x=l.d||0,y=l.k||0;d+=x;k+=y;if(x||y){used++;if(!l.akun||(x&&y))ok=false;else if(isSub(c.coa.find(a=>a.kode===l.akun))&&!(l.mitra||'').trim())nm++}});
  const sel=r2(d-k);return{d:r2(d),k:r2(k),sel,used,ok,nm,good:sel===0&&d>0&&ok&&used>=2};
}
function updBal(key,el,btn){
  const e=$('#'+el);if(!e||!DR[key])return;const b=balInfo(DR[key].lines);
  e.className='bal '+(b.good?'ok':'bad');
  e.textContent='Debit '+rp(b.d)+'  |  Kredit '+rp(b.k)+'  |  '+(b.sel===0?(b.d>0?'Seimbang':'Isi jumlahnya'):'Selisih '+rp(Math.abs(b.sel)))+(!b.ok&&b.used?'  |  Cek akun atau angka':'')+(b.good&&b.nm?'  |  '+b.nm+' baris piutang/hutang belum ada nama mitra':'');
  const x=$('#'+btn);if(x)x.disabled=!b.good;
}

function simpanJurnal(){
  const c=C(),j=DR.j;
  if(!validDate(j.tgl))return toast('Tanggal belum valid.');
  const no=(j.no||'').trim();if(!no)return toast('Isi nomor bukti.');
  if(noTaken(c,no,j.edit))return toast('Nomor bukti '+no+' sudah dipakai.');
  const rows=j.lines.filter(l=>l.d||l.k).map(l=>({id:uid(),no,tgl:j.tgl,ket:(j.ket||'').trim(),memo:(l.memo||'').trim(),akun:l.akun,d:r2(l.d||0),k:r2(l.k||0),mitra:(l.mitra||'').trim(),src:'manual'}));
  if(rows.length)rows[0].lamp=j.lamp.slice();

  const c=C(),d=DR[kind],arr=kind==='jual'?c.penjualan:c.pembelian,no=(d.no||'').trim(),old=d.id?arr.find(p=>p.id===d.id):null;

    const d=dataBB(c,R_.akun,f,t);

      d.rows.map(r=>'<tr><td>'+tglId(r[0]).slice(0,5)+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td class="n">'+(r[3]?rp(r[3]):'')+'</td><td class="n">'+(r[4]?rp(r[4]):'')+'</td><td class="n">'+rp(r[5])+'</td></tr>').join('')+
      '<tr class="tot"><td colspan="5">Saldo akhir</td><td class="n">'+rp(d.akhir)+'</td></tr></tbody></table></div>':'');
  }else if(R_.sub==='sp'||R_.sub==='sh'){
    const j=R_.sub==='sp'?'piutang':'hutang',ak=c.coa.filter(a=>a.tipe===j).sort(byKode);
    if(R_.sakun&&!ak.some(a=>a.kode===R_.sakun))R_.sakun='';
    const d=dataSub(c,j,R_.sakun,f,t);
    body='<h2>Sub ledger '+j+'</h2>'+fld('Akun',iSel('x',[['','Semua akun '+j]].concat(ak.map(a=>[a.kode,a.kode+' '+a.nama])),R_.sakun,0,' data-rsel="sakun"'))+
      '<div class="scroll" style="margin-top:8px"><table><thead><tr><th>'+(j==='piutang'?'Pelanggan / debitur':'Pemasok / kreditur')+'</th><th class="n">Saldo awal</th><th class="n">Debit</th><th class="n">Kredit</th><th class="n">Saldo akhir</th></tr></thead><tbody>'+
      (d.rows.length?d.rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td class="n">'+rp(r[1])+'</td><td class="n">'+rp(r[2])+'</td><td class="n">'+rp(r[3])+'</td><td class="n">'+rp(r[4])+'</td></tr>').join(''):'<tr><td colspan="5" class="muted">Belum ada saldo atau mutasi.</td></tr>')+
      '<tr class="tot"><td>Total</td>'+d.T.map(v=>'<td class="n">'+rp(v)+'</td>').join('')+'</tr></tbody></table></div>'+
      (d.tanpa?'<div class="bal bad" style="margin-top:10px">Ada saldo tanpa nama mitra. Lengkapi nama mitra pada jurnal supaya rincian per mitra benar.</div>':ok(true,'Total sub ledger sama dengan saldo akun di buku besar untuk periode ini.',''));
  }else{
    const r=dataKas(c,f,t);
    body='<h2>Kas &amp; bank</h2>'+(r.length?'<div class="scroll"><table><thead><tr><th>Akun</th><th class="n">Awal</th><th class="n">Masuk</th><th class="n">Keluar</th><th class="n">Akhir</th></tr></thead><tbody>'+r.map(x=>'<tr><td>'+esc(x[0]+' '+x[1])+'</td><td class="n">'+rp(x[2])+'</td><td class="n">'+rp(x[3])+'</td><td class="n">'+rp(x[4])+'</td><td class="n">'+rp(x[5])+'</td></tr>').join('')+
      '<tr class="tot"><td>Total</td>'+[2,3,4,5].map(i=>'<td class="n">'+rp(r.reduce((s,x)=>s+x[i],0))+'</td>').join('')+'</tr></tbody></table></div>':'<div class="muted">Belum ada akun yang ditandai sebagai kas atau bank.</div>');
  }
  const cur=LSUB.find(x=>x[0]===R_.sub);
  return '<div class="card"><div class="grid2"><label>Dari tanggal<input type="date" data-rep="dari" value="'+f+'"></label><label>Sampai tanggal<input type="date" data-rep="sampai" value="'+t+'"></label></div>'+
    '<div class="row" style="margin-top:10px">'+LSUB.map(([k,l])=>'<button class="chip'+(R_.sub===k?' on':'')+'" data-act="lsub" data-id="'+k+'">'+l+'</button>').join('')+'</div></div>'+
    '<div class="card">'+body+'<div class="row" style="margin-top:10px">'+xlBtn(cur[2],'laporan-'+cur[0])+'</div></div>';
}

/* ---------- impor file ---------- */
function importFile(key,file){
  if(noXlsx())return;
  const rd=new FileReader();
  rd.onerror=()=>{IMP[key]='<div class="msg bad">File tidak bisa dibaca.</div>';render()};
  rd.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true}),c=C(),res=analisisImpor(c,wb,IMPKEYS[key]);
      if(res.err.length)IMP[key]='<div class="msg bad"><b>Impor dibatalkan, ada '+res.err.length+' masalah. Tidak ada data yang diubah.</b><ul>'+res.err.slice(0,25).map(x=>'<li>'+esc(x)+'</li>').join('')+(res.err.length>25?'<li>dan '+(res.err.length-25)+' masalah lain.</li>':'')+'</ul></div>';
      else{res.commit();DR={};IMP[key]='<div class="msg ok"><b>Impor berhasil</b><ul>'+res.info.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'}
    }catch(x){IMP[key]='<div class="msg bad">File tidak bisa dibuka sebagai Excel. Pastikan formatnya .xlsx. ('+esc(x.message||x)+')</div>'}
    render();
  };
  rd.readAsArrayBuffer(file);
}
const readUrl=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});

/* ---------- aksi klik ---------- */
const go=t=>{tab=t;armed='';render();window.scrollTo(0,0)};
document.addEventListener('click',async e=>{
  const nb=e.target.closest('[data-tab]');if(nb){IMP={};go(nb.dataset.tab);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,id=b.dataset.id||'',key=act+':'+id;
  if(/^hapus/.test(act)){if(armed!==key){armed=key;render();return}armed=''}else armed='';
  const c=S.perusahaan.length?C():null;
  const st=(k,fn)=>{DR[k]=fn;render();window.scrollTo(0,0)};
  switch(act){
    case 'setup':return doSetup();
    case 'login':return doLogin();
    case 'keluar':return keluar();
    case 'tab':return go(id);
    case 'pilih':S.aktif=id;DR={};save();return render();
    case 'tambahp':{const n=($('#p-nama').value||'').trim();if(!n)return toast('Isi nama perusahaan.');const p=newCompany(n);S.perusahaan.push(p);S.aktif=p.id;DR={};tab='jurnal';save();toast('Perusahaan dibuat');return render()}
    case 'contoh':{const p=sample();S.perusahaan.push(p);S.aktif=p.id;DR={};tab='lap';save();return render()}
    case 'hapusp':{if(!ADM())return;S.perusahaan.filter(p=>p.id===id).forEach(p=>[].concat(p.jurnal.map(l=>l.lamp),p.penjualan.map(x=>x.lamp),p.pembelian.map(x=>x.lamp),p.stok.map(x=>x.lamp),p.aset.map(x=>x.lamp)).forEach(L=>lampBersih(L,[])));
      S.perusahaan=S.perusahaan.filter(p=>p.id!==id);S.aktif=S.perusahaan.length?(S.aktif===id?S.perusahaan[0].id:S.aktif):'';DR={};tab='usaha';save();return render()}
    case 'baris':DR[id].lines.push({akun:'',d:0,k:0,memo:'',mitra:''});return render();
    case 'rmbaris':{const [k,i]=id.split(':');DR[k].lines.splice(+i,1);return render()}
    case 'simpanj':return simpanJurnal();
    case 'simpans':return simpanSaldo();
    case 'bataljurnal':DR.j=newJ();return render();
    case 'ejurnal':{const ls=c.jurnal.filter(l=>l.no===id&&l.src==='manual');if(!ls.length)return;const f=ls[0];
      return st('j',{edit:id,tgl:f.tgl,no:id,ket:f.ket,lines:ls.map(l=>({akun:l.akun,d:l.d,k:l.k,memo:l.memo||'',mitra:l.mitra||''})),lamp:(ls.find(l=>l.lamp)||{lamp:[]}).lamp.slice()})}
    case 'hapusj':{if(!ADM())return;const o=c.jurnal.find(l=>l.no===id&&l.src==='manual'&&l.lamp);c.jurnal=c.jurnal.filter(l=>!(l.no===id&&l.src==='manual'));lampBersih(o&&o.lamp,[]);save();return render()}
    case 'jf':JF=id;JLIM=60;return render();
    case 'lagi':JLIM+=60;return render();
    case 'eakun':{if(!ADM())return;const a=c.coa.find(x=>x.kode===id);if(!a)return;return st('ak',{edit:a.kode,kode:a.kode,nama:a.nama,tipe:a.tipe,normal:a.normal,kas:!!a.kas})}
    case 'bataleak':DR.ak=newAk();return render();
    case 'simpanak':{if(!ADM())return;const a=DR.ak,kode=(a.kode||'').trim(),nama=(a.nama||'').trim();
      if(!kode||!nama)return toast('Isi kode dan nama akun.');
      if(a.edit){const o=c.coa.find(x=>x.kode===a.edit);o.nama=nama;o.tipe=a.tipe;o.normal=a.normal;o.kas=a.kas}
      else{if(c.coa.some(x=>x.kode===kode))return toast('Kode '+kode+' sudah ada.');c.coa.push({kode,nama,tipe:a.tipe,normal:a.normal,kas:a.kas})}
      save();DR.ak=newAk();toast('Akun tersimpan');return render()}
    case 'hapusa':if(ADM()&&!kodeUsed(c,id)){c.coa=c.coa.filter(a=>a.kode!==id);save();render()}return;
    case 'baritem':DR[id].items.push(blankItem());return render();
    case 'rmitem':{const [k,i]=id.split(':');DR[k].items.splice(+i,1);return render()}
    case 'simpantrx':return simpanTrx(id);
    case 'bataltrx':{const k=id;DR[k]=k==='sk'?newSk(c):k==='at'?newAt(c):newTrx(c,k);return render()}
    case 'etrx':{const [k,pid]=id.split(':'),p=(k==='jual'?c.penjualan:c.pembelian).find(x=>x.id===pid);if(!p)return;
      return st(k,{id:p.id,no:p.no,tgl:p.tgl,mitra:p.mitra,ket:p.ket,ppn:p.ppn,bayar:p.bayar,akunKas:p.akunKas||'',items:p.items.map(i=>Object.assign({},i)),lamp:p.lamp.slice()})}
    case 'hapustrx':{if(!ADM())return;const [k,pid]=id.split(':'),arr=k==='jual'?c.penjualan:c.pembelian,p=arr.find(x=>x.id===pid);if(!p)return;lampBersih(p.lamp,[]);arr.splice(arr.indexOf(p),1);rebuild(c);save();return render()}
    case 'ebrg':{const x=c.barang.find(z=>z.id===id);if(x)st('br',Object.assign({},x));return}
    case 'batalbrg':DR.br=newBr();return render();
    case 'simpanbrg':return simpanBarang();
    case 'hapusbrg':if(ADM()){c.barang=c.barang.filter(z=>z.id!==id);rebuild(c);save();render()}return;
    case 'estok':{const s=c.stok.find(z=>z.id===id);if(s)st('sk',Object.assign({},s,{lamp:(s.lamp||[]).slice()}));return}
    case 'simpanstok':return simpanStok();
    case 'hapusstok':{if(!ADM())return;const s=c.stok.find(z=>z.id===id);if(s){lampBersih(s.lamp,[]);c.stok=c.stok.filter(z=>z.id!==id);rebuild(c);save();render()}return}
    case 'eat':{const a=c.aset.find(z=>z.id===id);if(a)st('at',Object.assign({},a,{lamp:(a.lamp||[]).slice()}));return}
    case 'simpanat':return simpanAset();
    case 'hapusat':{if(!ADM())return;const a=c.aset.find(z=>z.id===id);if(a){lampBersih(a.lamp,[]);c.aset=c.aset.filter(z=>z.id!==id);rebuild(c);save();render()}return}
    case 'lsub':R_.sub=id;return render();
    case 'tpl':return unduhTemplate(id?id.split(','):null);
    case 'xl':{const jn=b.dataset.j||'laporan';return exportSheets(id?id.split(','):null,jn,R_.dari,R_.sampai)}
    case 'lbuka':return bukaLamp(id);
    case 'lhapus':{const [k,lid]=[id.split(':')[0],id.split(':')[1]];DR[k].lamp=DR[k].lamp.filter(x=>x.id!==lid);return render()}
    case 'bnsimpan':{if(!ADM())return;S.setelan.banner=Object.assign({},DR.bn);save();toast('Banner disimpan');return render()}
    case 'bnhapusimg':DR.bn.img='';return render();
    case 'gantipw':{const p=DR.pw.baru||'';if(p.length<4)return toast('Kata sandi minimal 4 karakter.');const u=curUser();u.salt=uid();u.pw=await hashPw(p,u.salt);save();DR.pw={baru:''};toast('Kata sandi diganti');return render()}
    case 'tambahu':{if(!ADM())return;const x=DR.us,user=(x.user||'').trim().toLowerCase(),nama=(x.nama||'').trim();
      if(!nama||!user||(x.pw||'').length<4)return toast('Isi nama, nama pengguna, dan kata sandi minimal 4 karakter.');
      if(S.users.some(z=>z.user===user))return toast('Nama pengguna sudah dipakai.');
      const salt=uid();S.users.push({id:uid(),nama,user,salt,pw:await hashPw(x.pw,salt),role:x.role});save();DR.us={nama:'',user:'',pw:'',role:'staf'};toast('Pengguna ditambahkan');return render()}
    case 'hapusu':{if(!ADM()||id===SES)return;const t=S.users.find(z=>z.id===id);if(t&&t.role==='admin'&&S.users.filter(z=>z.role==='admin').length<2)return toast('Harus ada minimal satu Admin.');S.users=S.users.filter(z=>z.id!==id);save();return render()}
  }
});
/* ---------- input form ---------- */
document.addEventListener('input',e=>{
  const t=e.target,p=t.dataset&&t.dataset.b;if(!p)return;
  const ty=t.dataset.t;if(ty==='chk')return;
  let v=t.value;if(ty==='rp'){fmtInput(t);v=parseRp(t.value)}else if(ty==='n')v=parseN(v);
  try{setPath(DR,p,v)}catch(x){return}
  if(ty==='rp'&&v&&/\.(d|k)$/.test(p)){const sib=p.replace(/\.d$/,'.@').replace(/\.k$/,'.d').replace(/\.@$/,'.k');try{setPath(DR,sib,0)}catch(x){}const el=document.querySelector('[data-b="'+sib+'"]');if(el)el.value=''}
  if(p.slice(0,3)==='bn.'){const el=document.querySelector('.ban');if(el)el.outerHTML=bannerHtml(DR.bn)}
  live();
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='sw'){S.aktif=t.value;DR={};armed='';save();return render()}
  if(t.dataset.rsel){R_[t.dataset.rsel]=t.value;return render()}
  if(t.dataset.rep){R_[t.dataset.rep]=t.value;return render()}
  if(t.dataset.imp&&t.files[0])return importFile(t.dataset.imp,t.files[0]);
  if(t.dataset.lamp&&t.files[0])return addLamp(t.dataset.lamp,t.files[0]);
  if(t.dataset.bnimg&&t.files[0]){try{DR.bn.img=await readUrl(await kompres(t.files[0],1000,.6));render()}catch(x){toast('Gambar tidak bisa dibaca.')}return}
  const p=t.dataset.b;if(!p)return;
  const ty=t.dataset.t;let v=t.value;
  if(ty==='chk')v=t.checked;else if(ty==='rp')v=parseRp(v);else if(ty==='n')v=parseN(v);
  try{setPath(DR,p,v)}catch(x){return}
  if(p==='ak.tipe')DR.ak.normal=normalOf(v);
  if(p.slice(0,4)==='map.'){const c=C();rebuild(c);save();toast('Akun otomatis diperbarui');return render()}
  const m=p.match(/^(jual|beli)\.items\.(\d+)\.sel$/);
  if(m){const it=DR[m[1]].items[+m[2]],b=bOf(C(),v);if(b&&!it.uraian){const x=C().barang.find(z=>z.id===b);if(x)it.uraian=x.nama}}
  if(t.dataset.r)render();
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('kls')){DR.kls=DR.kls||{};DR.kls[d.dataset.kls]=d.open}},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest&&e.target.closest('.wl')&&e.target.tagName==='INPUT'){const b=document.querySelector('.wl button.pri');if(b)b.click()}});

render();
